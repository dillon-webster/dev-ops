# The "production" stack. You shouldn't need to edit this file.
name: devops-lab04

services:
  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8400:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    restart: unless-stopped

  web:
    build: ../../app
    env_file: app.env
    depends_on:
      cache:
        condition: service_healthy
    restart: unless-stopped

  cache:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "s3cret-lab04", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a s3cret-lab04 --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      retries: 5
    volumes:
      - cache-data:/data
    restart: unless-stopped

volumes:
  cache-data:
