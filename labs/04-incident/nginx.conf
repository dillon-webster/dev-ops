server {
    listen 80;

    # Use Docker's internal DNS and resolve "web" at request time,
    # so nginx keeps running even when the app is down.
    resolver 127.0.0.11 valid=5s;
    set $app http://web:5000;

    location / {
        proxy_pass $app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
    }
}
